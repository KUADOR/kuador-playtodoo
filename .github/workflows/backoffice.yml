name: backoffice
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backoffice/**'
      - '.github/workflows/backoffice.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backoffice/**'
      - '.github/workflows/backoffice.yml'
permissions:
  contents: read
jobs:
  backoffice:
    name: backoffice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci
      - name: Format
        run: npx prettier --check src
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false
