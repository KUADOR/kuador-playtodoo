# CI of the api piece (Java 25 · Spring Boot 4). Runs only when api/ or this workflow changes.
# Integration tests (*IT) use Testcontainers: GitHub-hosted ubuntu runners ship a running Docker daemon.
name: api

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Check Docker is available for Testcontainers
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: Build and test (unit and Testcontainers integration tests)
        run: ./mvnw -B verify
