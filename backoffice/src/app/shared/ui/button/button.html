<button
  class="button"
  [class]="'button--' + variant()"
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-disabled]="loading() || null"
  [attr.aria-busy]="loading() || null"
  [attr.aria-label]="accessibleLabel() || null"
  (click)="handleClick($event)"
>
  @if (loading()) {
    <svg lucideLoaderCircle class="button__spinner" [size]="spinnerSize"></svg>
  }
  <span>{{ visibleLabel() }}</span>
</button>
