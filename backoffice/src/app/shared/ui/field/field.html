<label class="field__label" [for]="controlId">{{ label() }}</label>

@if (kind() === 'select') {
  <select
    #control
    class="field__control"
    [class.field__control--error]="hasError()"
    [id]="controlId"
    [disabled]="disabled()"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="describedBy()"
    (change)="updateValue($event)"
  >
    @if (placeholder()) {
      <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
} @else if (kind() === 'textarea') {
  <textarea
    #control
    class="field__control field__control--multiline"
    [class.field__control--error]="hasError()"
    [id]="controlId"
    [rows]="rows()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    [attr.autocomplete]="autocomplete() || null"
    [attr.maxlength]="maxLength() ?? null"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="describedBy()"
    (input)="updateValue($event)"
  ></textarea>
} @else {
  <div class="field__row">
    <input
      #control
      class="field__control"
      [class.field__control--error]="hasError()"
      [type]="inputType()"
      [id]="controlId"
      [disabled]="disabled()"
      [value]="value()"
      [attr.placeholder]="placeholder() || null"
      [attr.autocomplete]="autocomplete() || null"
      [attr.inputmode]="inputMode() || null"
      [attr.maxlength]="maxLength() ?? null"
      [attr.max]="max() || null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="describedBy()"
      (input)="updateValue($event)"
    />
    @if (suffix()) {
      <span class="field__suffix" [id]="suffixId">{{ suffix() }}</span>
    }
  </div>
}

@if (help()) {
  <p class="field__help" [id]="helpId">{{ help() }}</p>
}

@if (hasError()) {
  <p class="field__error" [id]="errorId">
    <svg lucideCircleAlert class="field__error-icon" [size]="errorIconSize"></svg>
    <span>{{ error() }}</span>
  </p>
}
