spring.application.name=platodo-api

# PostgreSQL (ADR-001). Defaults match api/compose.yaml; every other environment sets
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/platodo
spring.datasource.username=platodo

# Global migrations only (ADR-009). Tenant migrations run per tenant schema after them.
spring.flyway.schemas=global
spring.flyway.locations=classpath:db/migration/global

# Tenant hosts are {subdomain}.<root domain> and the global host is api.<root domain> (ADR-002, ADR-012).
# Every deployed environment sets PLAYTODOO_ROOT_DOMAIN (production: playtodoo.com); it must match the proxy's
# PLATODO_ROOT_DOMAIN.
playtodoo.root-domain=localhost

# The host of a request comes from X-Forwarded-Host only when the request arrives from a trusted proxy
# (server.tomcat.remoteip.internal-proxies; each deployed environment narrows it to the proxy network).
server.request.header.forwarded.strategy=web-server

# Access tokens of Identity and access (PLATODO-26 design). The signing key is a secret: every environment sets
# PLAYTODOO_IDENTITY_TOKEN_SIGNING_KEY (Base64, at least 256 bits, for example `openssl rand -base64 32`); the api
# does not start without it. The lifetime is a security setting.
playtodoo.identity.token.time-to-live=PT1H

# CORS (ADR-011): the only browser origin allowed besides the host itself is the backoffice. Local default matches
# infra/local (http://admin.localhost:8000); every deployed environment sets PLAYTODOO_CORS_BACKOFFICE_ORIGIN
# (production: https://admin.playtodoo.com).
playtodoo.cors.backoffice-origin=http://admin.localhost:8000

# Kuador access sessions to a complex (ADR-011). Lifetime is a security setting, not a business rule.
playtodoo.audit.access-session.time-to-live=PT30M

# Base URL of the web of a complex, answered when its owner changes the subdomain. Every deployed environment sets
# PLAYTODOO_TENANT_URL_PATTERN (production: https://{subdomain}.playtodoo.com); the default is the local proxy.
playtodoo.tenant-url-pattern=http://{subdomain}.localhost:8000

# Tenant lifecycle (ADR-013, ADR-014): retention of a new suspension, or of a cancellation while active, before the
# purge, in days (decision of Kuador). The SUPER_ADMIN can change it per complex while suspended or archived.
tenancy.archive.default-retention-days=45

# Subdomains no complex may take (ADR-012). The label of the global host (api) is always reserved as well.
tenancy.subdomains.reserved=www,api,admin,app,backoffice,static,cdn,assets,mail,smtp,ftp,status,docs,help,soporte,\
  blog,dev,staging,test,localhost,playtodoo,kuador

# Permanent deletion (ADR-013, ADR-015): daily job, in UTC, that purges the suspended and archived complexes whose
# retention ended. Safe with several api instances. Spring cron: second minute hour day-of-month month day-of-week.
tenancy.purge.enabled=true
tenancy.purge.cron=0 0 3 * * *

# Retention of the records of Kuador (ADR-016): the access audit (playtodoo.audit.retention-days) and the subscription
# history and capability changes (playtodoo.history.retention-days) are kept for 365 days (decision of Kuador); the
# listings never show older rows and a daily job, in UTC, deletes them. Safe with several api instances.
playtodoo.audit.retention-days=365
playtodoo.history.retention-days=365
playtodoo.retention.enabled=true
playtodoo.retention.cron=0 30 3 * * *
