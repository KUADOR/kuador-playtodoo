# Test-only settings, layered over src/main/resources/application.properties for every test context.
# Fixed signing key for tests only: it signs nothing outside the test JVM and is not used by any environment.
playtodoo.identity.token.signing-key=dGVzdC1vbmx5LXNpZ25pbmcta2V5LWZvci1wbGF0b2RvLWFwaS10ZXN0cw==

# Every cached test context keeps its own pool against the one Testcontainers PostgreSQL (100 connections). Hikari
# opens maximum-pool-size idle connections per pool by default; keeping one idle connection per context lets the
# suite grow without hitting "too many clients", while each pool can still open up to its maximum under load.
spring.datasource.hikari.minimum-idle=1

# The purge job deletes schemas: tests call the purge use case themselves instead of waiting for its schedule.
tenancy.purge.enabled=false

# The retention jobs delete rows by date: tests call the retention use cases themselves.
playtodoo.retention.enabled=false
