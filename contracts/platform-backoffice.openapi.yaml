                        kind: STATUS
                        before: ACTIVE
                        after: SUSPENDED
                        changedBy:
                          id: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
                          displayName: Sam Example
                        changedAt: '2027-01-10T12:00:00Z'
                      - id: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
                        kind: PLAN
                        before: Basic
                        after: Premium
                        changedBy:
                          id: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
                          displayName: Sam Example
