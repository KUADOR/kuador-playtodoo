openapi: 3.1.0
info:
  title: Playtodoo Platform Backoffice API
  version: 1.0.0
  summary: Complexes, plans, subscriptions, payments, operator capabilities and audited support access for the Kuador backoffice.
  description: |
    Contract of the platform operations used by `backoffice` (epic PLATODO-27; ADR-014 to ADR-020,
    which adjust ADR-011 and ADR-013). Modules: **Plans and subscriptions**, **Identity and access**,
    **Support access**, **Audit** and **Tenancy**.

    **Host and base path.** Global host only (`api.playtodoo.com`), base `/api/v1/platform`, the
    same base used by the platform operations of `tenancy.openapi.yaml`. A request to a tenant host
    answers `404`. The root domain is configurable per environment (`playtodoo.root-domain`).

    **Authentication.** Bearer access token issued by `POST /auth/platform/login`
    (`tenancy.openapi.yaml`), with `typ = PLATFORM` and `role` `SUPER_ADMIN` or `OPERATOR`.
    `STAFF` and `PLAYER` tokens answer `403 FORBIDDEN` on every operation of this contract.

    **Authorization (ADR-017).** Evaluated by the `api` on every request; the `backoffice` only hides
    what the caller cannot do.
    - `SUPER_ADMIN`: every operation.
    - `OPERATOR`: reads the complex list, detail, payments and history, plus the operations guarded
      by a capability that the `SUPER_ADMIN` enabled: `COMPLEX_CREATE`,
      `SUBSCRIPTION_PAYMENT_RECORD`, `SUBSCRIPTION_STATUS_CHANGE` and `TENANT_DATA_ACCESS`. All are
      disabled initially.
    - Operations marked **SUPER_ADMIN only** answer `403 FORBIDDEN` to an `OPERATOR`. Operations
      guarded by a capability the operator does not have (or no longer has) answer
      `403 CAPABILITY_REVOKED`; the change applies to the next request.

    **Complex id.** A complex is identified by its tenant id (`complexId` = `tenantId` of
    `tenancy.openapi.yaml`). Subdomain availability while registering a complex uses the public
    `GET /subdomains/{subdomain}/availability` of `tenancy.openapi.yaml`.

    **Optimistic concurrency.** Every mutation on a complex, on the operator capabilities and on a
    plan or plan field carries the `version` the caller read. If it no longer matches, the `api`
    answers `409 STALE_STATE` and changes nothing.

    **Subscription and tenant lifecycle (ADR-014).** The commercial status of the subscription and
    the lifecycle status of the tenant are separate. Status changes are always manual:

    | From | To | Effect on the tenant |
    |---|---|---|
    | (registration) | `ACTIVE` | Tenant becomes `ACTIVE` when its schema is created and migrated |
    | `ACTIVE`, `EXPIRING` | `EXPIRING` | None |
    | `EXPIRING` | `ACTIVE` | None |
    | `ACTIVE`, `EXPIRING` | `SUSPENDED` | Tenant `SUSPENDED`, `purgeDueAt = suspendedAt + retentionDays` |
    | `ACTIVE`, `EXPIRING` | `CANCELLED` | Tenant `ARCHIVED`, `purgeDueAt = archivedAt + retentionDays` |
    | `SUSPENDED` | `ACTIVE` | Only while `now < purgeDueAt`; tenant `ACTIVE`, retention cleared |
    | `SUSPENDED` | `CANCELLED` | Tenant `ARCHIVED`, keeps the `purgeDueAt` that was running |
    | `CANCELLED` | none | Terminal: a cancelled subscription is never reactivated |

    When `purgeDueAt` is reached the purge job deletes the complex schema automatically (ADR-015,
    ADR-016): the tenant goes `PURGING` then `PURGED`. Subscription, payments, history and audit are
    kept (history and audit for 365 days).

    **Support on the complex host (ADR-020).** A support session opened here with a reason grants
    access to the existing staff operations of `bookings.openapi.yaml` on
    `{subdomain}.playtodoo.com/api/v1`, sending the platform bearer token plus the header
    `X-Support-Session: <sessionId>`. The tenant is still resolved from the subdomain (ADR-002):
    - The session must be open, not expired, belong to the caller and to the resolved tenant, and
      the caller's role must still allow the current tenant status; otherwise
      `403 SUPPORT_SESSION_INVALID`.
    - `ACTIVE` tenant: `SUPER_ADMIN`, or `OPERATOR` with `TENANT_DATA_ACCESS`; read and write.
    - `SUSPENDED` or `ARCHIVED` tenant: only `SUPER_ADMIN`; read and write (query, create, block and
      cancel). Every booking returned there carries `inactive: true` (ADR-019).
    - `PROVISIONING`, `PROVISIONING_FAILED`, `PURGING` and `PURGED`: never accessible; open sessions
      are invalidated when the tenant enters `PURGING`.
    - Every request under a session, allowed or denied, is audited synchronously before it runs
      with its `operationId`, method and route template (never the concrete path or query string).

    **Verified while writing this contract (PLATODO-81).**
    - Migrations: Flyway (ADR-009), global set in `api/src/main/resources/db/migration/global`
      (V1 to V5 today) and tenant set in `.../tenant`.
    - Courts and valid slots for support: **there is no endpoint** to list the courts of a complex
      or its valid slots, on the tenant host or elsewhere. The Courts and Availability modules do
      not exist yet: `CourtSlotRules` is the fail-closed `UnconfiguredCourtSlotRules`, so every
      court is reported as not found. Support can read bookings and blocks
      (`GET /staff/bookings`, which returns `courtId`) and cancel them; creating bookings or blocks
      answers `404 COURT_NOT_FOUND` until a Courts module exists. Adding courts is out of the scope
      of PLATODO-27 (internal configuration of the complex); see the risk noted in ADR-020.

    **Errors.** Problem Details (RFC 9457, `application/problem+json`) with a stable `code`. The
    `backoffice` maps `code` to the Spanish text of «Pantallas»; `title` and `detail` are for
    developers and never contain personal data. Field validation answers
    `422 VALIDATION_FAILED` with `fieldErrors`. A malformed body or parameter answers
    `400 INVALID_REQUEST`.

    **Pagination.** `page` (zero-based) and `size` (default 20, maximum 100). Responses carry
    `items`, `page`, `size` and `totalItems`.

    **Dates.** Instants in UTC, ISO-8601. `paidOn` is a date without time. Display time zone:
    [POR DEFINIR: launch country].

    **Money.** Amounts are decimal strings (up to 15 integer digits and 4 decimals) to avoid
    floating point. Allowed currencies and periodicities come from `GET /plan-options`
    ([POR DEFINIR: values]).
  contact:
    name: Kuador
servers:
  - url: https://api.playtodoo.com/api/v1/platform
    description: Global context (no tenant).
tags:
  - name: Me
    description: The authenticated platform user.
  - name: Complexes
    description: Registration, list and detail of complexes with their subscription and tenant status.
  - name: Subscriptions
    description: Plan changes, manual status changes, retention, payments and history of a complex.
  - name: Plans
    description: Commercial plans with basic and custom fields. SUPER_ADMIN only, except reading published plans.
  - name: Plan fields
    description: Definitions of the fields a plan can have. SUPER_ADMIN only.
  - name: Operator capabilities
    description: Capabilities the SUPER_ADMIN enables for operators. SUPER_ADMIN only.
  - name: Support access
    description: Support sessions with a reason and the audit of every request made under them.
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags: [Me]
      operationId: getCurrentPlatformUser
      summary: Get the authenticated platform user and their effective capabilities.
      description: |
        `capabilities` lists the capabilities effective for this request: all of them for a
        `SUPER_ADMIN`, the enabled ones for an `OPERATOR`. The `backoffice` uses it to show or hide
        actions; the `api` still checks every request.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPlatformUser'
              examples:
                superAdmin:
                  summary: Super admin
                  value:
                    id: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
                    displayName: Sam Example
                    role: SUPER_ADMIN
                    capabilities: [COMPLEX_CREATE, SUBSCRIPTION_PAYMENT_RECORD, SUBSCRIPTION_STATUS_CHANGE, TENANT_DATA_ACCESS]
                operator:
                  summary: Operator with one capability enabled
                  value:
                    id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                    displayName: Robin Example
                    role: OPERATOR
                    capabilities: [SUBSCRIPTION_PAYMENT_RECORD]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /complexes:
    get:
      tags: [Complexes]
      operationId: listComplexes
      summary: List complexes with their plan, subscription status and last payment.
      description: |
        Both roles. Newest first. Includes purged complexes (`tenantStatus = PURGED`, `subdomain`
        null). Built from the module's own tables plus `TenantDirectory` in one batch query (no N+1).
        Search and filters are out of scope.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of complexes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexPage'
              examples:
                page:
                  value:
                    items:
                      - id: 5f1c2a3b-4d5e-4f6a-8b7c-9d0e1f2a3b4c
                        displayName: Canchas El Sol
                        subdomain: canchas-el-sol
                        plan:
                          id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                          name: Premium
                        subscriptionStatus: ACTIVE
                        tenantStatus: ACTIVE
                        purgeDueAt: null
                        lastPayment:
                          amount: '120.00'
                          currency: USD
                          paidOn: '2026-12-01'
                      - id: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e1f
                        displayName: Complejo La Esquina
                        subdomain: la-esquina
                        plan:
                          id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                          name: Basic
                        subscriptionStatus: SUSPENDED
                        tenantStatus: SUSPENDED
                        purgeDueAt: '2027-02-24T12:00:00Z'
                        lastPayment: null
                    page: 0
                    size: 20
                    totalItems: 2
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Complexes]
      operationId: registerComplex
      summary: Register a complex, provision its schema and start its subscription.
      description: |
        Capability `COMPLEX_CREATE`. In one global transaction it records the tenant, reserves the
        subdomain and creates the subscription in `ACTIVE` with a snapshot of the published plan.
        Then it creates and migrates the schema `t_<uuid>` and the owner staff account
        (`ownerEmail`). Answers `201` in both outcomes:
        - `tenantStatus = ACTIVE`: provisioning finished.
        - `tenantStatus = PROVISIONING_FAILED`: the tenant was recorded but its schema could not be
          created; retry with `POST /complexes/{complexId}/provisioning-retries`.
        Sending invitations to the owner is out of scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterComplexRequest'
            examples:
              register:
                value:
                  displayName: Canchas El Sol
                  subdomain: canchas-el-sol
                  ownerEmail: owner@example.com
                  planId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
      responses:
        '201':
          description: Complex registered. Check `tenantStatus` for the provisioning outcome.
          headers:
            Location:
              description: URL of the complex.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/platform/complexes/5f1c2a3b-4d5e-4f6a-8b7c-9d0e1f2a3b4c
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexDetail'
              examples:
                active:
                  $ref: '#/components/examples/ActiveComplex'
                provisioningFailed:
                  $ref: '#/components/examples/ProvisioningFailedComplex'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '409':
          description: '`SUBDOMAIN_TAKEN`: the subdomain is used, or was used, by a complex (ADR-012).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subdomainTaken:
                  $ref: '#/components/examples/SubdomainTakenProblem'
        '422':
          description: |
            `SUBDOMAIN_INVALID`: breaks the format rules. `SUBDOMAIN_RESERVED`: in the reserved list.
            `PLAN_NOT_PUBLISHED`: the plan does not exist or is a draft.
            `VALIDATION_FAILED`: `displayName` blank or longer than 120, or `ownerEmail` malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                subdomainInvalid:
                  $ref: '#/components/examples/SubdomainInvalidProblem'
                subdomainReserved:
                  $ref: '#/components/examples/SubdomainReservedProblem'
                planNotPublished:
                  $ref: '#/components/examples/PlanNotPublishedProblem'
                validationFailed:
                  $ref: '#/components/examples/ValidationFailedProblem'
  /complexes/{complexId}:
    get:
      tags: [Complexes]
      operationId: getComplex
      summary: Get a complex with its plan snapshot, subscription and tenant lifecycle.
      description: |
        Both roles. `allowedTransitions` lists the subscription statuses the complex can move to
        now (empty while the tenant is not provisioned, after cancellation and once the retention
        expired). After a purge `ownerEmail` and `subdomain` are null.
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      responses:
        '200':
          description: The complex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexDetail'
              examples:
                active:
                  $ref: '#/components/examples/ActiveComplex'
                suspended:
                  $ref: '#/components/examples/SuspendedComplex'
                purged:
                  $ref: '#/components/examples/PurgedComplex'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
  /complexes/{complexId}/provisioning-retries:
    post:
      tags: [Complexes]
      operationId: retryComplexProvisioning
      summary: Retry the provisioning of a complex whose schema could not be created.
      description: |
        Capability `COMPLEX_CREATE`. Only when `tenantStatus = PROVISIONING_FAILED`. Idempotent:
        moves the tenant back to `PROVISIONING` and re-runs schema creation, migrations and owner
        account creation. Answers `202` with the complex; poll `GET /complexes/{complexId}` until
        `tenantStatus` is `ACTIVE` or `PROVISIONING_FAILED`.
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      responses:
        '202':
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexDetail'
              examples:
                provisioning:
                  $ref: '#/components/examples/ProvisioningComplex'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
        '409':
          description: '`NOT_PROVISIONING_FAILED`: the tenant is not waiting for a provisioning retry.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notProvisioningFailed:
                  value:
                    type: https://playtodoo.com/problems/not-provisioning-failed
                    title: Provisioning did not fail
                    status: 409
                    code: NOT_PROVISIONING_FAILED
  /complexes/{complexId}/plan:
    put:
      tags: [Subscriptions]
      operationId: changeComplexPlan
      summary: Change the plan of a complex.
      description: |
        SUPER_ADMIN only. Takes a new snapshot of the published plan; later edits of the plan never
        change it (ADR-018). Records a `PLAN` entry in the history and publishes
        `SubscriptionPlanChanged`.
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
            examples:
              upgrade:
                value:
                  planId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  version: 3
      responses:
        '200':
          $ref: '#/components/responses/ComplexChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
        '409':
          $ref: '#/components/responses/StaleState'
        '422':
          description: |
            `PLAN_NOT_PUBLISHED`: the plan does not exist or is a draft. `SAME_PLAN`: it is already
            the plan of the complex. `SUBSCRIPTION_CANCELLED`: the subscription is cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                planNotPublished:
                  $ref: '#/components/examples/PlanNotPublishedProblem'
                samePlan:
                  value:
                    type: https://playtodoo.com/problems/same-plan
                    title: Same plan
                    status: 422
                    code: SAME_PLAN
                subscriptionCancelled:
                  value:
                    type: https://playtodoo.com/problems/subscription-cancelled
                    title: Subscription cancelled
                    status: 422
                    code: SUBSCRIPTION_CANCELLED
  /complexes/{complexId}/status-changes:
    post:
      tags: [Subscriptions]
      operationId: changeSubscriptionStatus
      summary: Manually change the subscription status and apply its effect on the tenant.
      description: |
        Capability `SUBSCRIPTION_STATUS_CHANGE` (suspend, reactivate, cancel and mark expiring).
        Allowed transitions are in the table of the contract description. The subscription change,
        the tenant lifecycle change (`SubscriptionStatusChanged` is handled synchronously by
        Tenancy) and the catalog visibility are committed in one transaction. The response carries
        the applied effect (`tenantStatus`, `retentionDays`, `purgeDueAt`). Records a `STATUS`
        history entry.
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
            examples:
              suspend:
                value:
                  targetStatus: SUSPENDED
                  version: 3
              cancel:
                value:
                  targetStatus: CANCELLED
                  version: 4
      responses:
        '200':
          description: Status changed; the body shows the effect on the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexDetail'
              examples:
                suspended:
                  $ref: '#/components/examples/SuspendedComplex'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
        '409':
          $ref: '#/components/responses/StaleState'
        '422':
          description: |
            `TRANSITION_NOT_ALLOWED`: the target is not in `allowedTransitions` (for example from
            `CANCELLED`, or while the tenant is not provisioned). `RETENTION_EXPIRED`: reactivation
            after `purgeDueAt`, or while the tenant is `PURGING` or `PURGED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                transitionNotAllowed:
                  value:
                    type: https://playtodoo.com/problems/transition-not-allowed
                    title: Transition not allowed
                    status: 422
                    detail: CANCELLED is terminal.
                    code: TRANSITION_NOT_ALLOWED
                retentionExpired:
                  value:
                    type: https://playtodoo.com/problems/retention-expired
                    title: Retention expired
                    status: 422
                    detail: The purge date has passed; the complex can no longer be reactivated.
                    code: RETENTION_EXPIRED
  /complexes/{complexId}/retention:
    put:
      tags: [Subscriptions]
      operationId: changeComplexRetention
      summary: Change the retention period of a suspended or archived complex.
      description: |
        SUPER_ADMIN only. Only while `tenantStatus` is `SUSPENDED` or `ARCHIVED`. Recomputes
        `purgeDueAt` from the date retention started (`suspendedAt`, or `archivedAt` when the
        complex was cancelled while active). The new `purgeDueAt` must be in the future, so this
        call never triggers a purge. Upper bound: [POR DEFINIR: maximum retention days, if any].
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRetentionRequest'
            examples:
              extend:
                value:
                  retentionDays: 60
                  version: 4
      responses:
        '200':
          $ref: '#/components/responses/ComplexChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
        '409':
          $ref: '#/components/responses/StaleState'
        '422':
          description: |
            `NOT_IN_RETENTION`: the tenant is not `SUSPENDED` or `ARCHIVED`.
            `RETENTION_DEADLINE_IN_PAST`: the resulting `purgeDueAt` would not be in the future.
            `VALIDATION_FAILED`: `retentionDays` lower than 1.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notInRetention:
                  value:
                    type: https://playtodoo.com/problems/not-in-retention
                    title: Not in retention
                    status: 422
                    code: NOT_IN_RETENTION
                deadlineInPast:
                  value:
                    type: https://playtodoo.com/problems/retention-deadline-in-past
                    title: Retention deadline in the past
                    status: 422
                    detail: The resulting purge date must be in the future.
                    code: RETENTION_DEADLINE_IN_PAST
  /complexes/{complexId}/payments:
    get:
      tags: [Subscriptions]
      operationId: listComplexPayments
      summary: List the subscription payments recorded for a complex.
      description: Both roles. Newest `paidOn` first, then newest `recordedAt`. Also for purged complexes.
      parameters:
        - $ref: '#/components/parameters/ComplexId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              examples:
                page:
                  value:
                    items:
                      - id: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
                        amount: '120.00'
                        currency: USD
                        paidOn: '2026-12-01'
                        method: TRANSFER
                        recordedBy:
                          id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
                          displayName: Robin Example
                        recordedAt: '2026-12-02T10:15:00Z'
                    page: 0
                    size: 20
                    totalItems: 1
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
    post:
      tags: [Subscriptions]
      operationId: recordComplexPayment
      summary: Record a subscription payment received outside the platform.
      description: |
        Capability `SUBSCRIPTION_PAYMENT_RECORD`. Payments are collected outside the platform
        (ADR-004); this only records them. The currency is taken from the plan snapshot of the
        subscription. Payments are immutable: no edit or delete. Legal retention of payments:
        [POR DEFINIR: obligations of the launch country].
      parameters:
        - $ref: '#/components/parameters/ComplexId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
            examples:
              transfer:
                value:
                  amount: '100.00'
                  paidOn: '2026-12-01'
                  method: TRANSFER
      responses:
        '201':
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                recorded:
                  $ref: '#/components/examples/RecordedPayment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CapabilityForbidden'
        '404':
          $ref: '#/components/responses/ComplexNotFound'
        '422':
          description: '`VALIDATION_FAILED`: `amount` not greater than 0, `paidOn` in the future or unknown `method`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                futureDate:
                  value:
                    type: https://playtodoo.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    code: VALIDATION_FAILED
