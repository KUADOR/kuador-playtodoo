name: playtodoo
description: "Playtodoo app for players: find and book sports courts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  # Pinned in .github/workflows/movil.yml (FLUTTER_VERSION).
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end walkthrough against the local api (integration_test/, infra/local/e2e).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
